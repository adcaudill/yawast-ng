---
layout: default
---

<article class="post">
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%-d %B %Y" }}</span>
      <span class="post-author">by {{ page.author | default: site.author }}</span>
    </div>
  </div>

  <div class="post-content">
    {{content}}
  </div>
</article>
